<!doctype html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Přihlášení | CodeServices</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head><body><header class="app-header"><a class="app-brand" href="index.html">CodeServices</a><a href="index.html">← Zpět na služby</a></header><main class="app-main"><section class="panel narrow"><p class="eyebrow">zákaznický účet</p><h1>Přihlaste se<br>nebo se <em>registrujte.</em></h1><p class="lead">Po přihlášení můžete poslat objednávku a sledovat její přehled.</p><div class="tabs"><button class="active" data-tab="login">Přihlášení</button><button data-tab="register">Registrace</button></div><form class="form" id="login-form"><label>E-mail<input type="email" name="email" autocomplete="email" required></label><label>Heslo<input type="password" name="password" autocomplete="current-password" minlength="8" required></label><button class="button">Přihlásit se →</button></form><form class="form hidden" id="register-form"><label>E-mail<input type="email" name="email" autocomplete="email" required></label><label>Heslo <small>(alespoň 8 znaků)</small><input type="password" name="password" autocomplete="new-password" minlength="8" required></label><button class="button">Vytvořit účet →</button></form><p class="notice" id="notice" role="status"></p></section></main><script src="auth.js"></script></body></html>
